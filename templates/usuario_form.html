{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block breadcrumb %}Usuários &rsaquo; Novo{% endblock %}

{% block content %}
<div class="page-title">Novo usuário</div>

<form class="card" method="post" style="max-width: 420px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if erro %}
  <div class="login-msg login-msg-erro" style="margin-bottom: 16px">{{ erro }}</div>
  {% endif %}

  <div class="form-grid" style="grid-template-columns: 1fr;">
    <div class="field">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ request.form.get('nome', '') }}">
    </div>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required value="{{ request.form.get('email', '') }}">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required minlength="8">
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" name="is_admin" value="1" style="width:auto" {{ "checked" if request.form.get('is_admin') else "" }}>
        Administrador (pode cadastrar outros usuários)
      </label>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-green" type="submit">Cadastrar</button>
    <a class="btn btn-outline" href="{{ url_for('listar_usuarios') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
