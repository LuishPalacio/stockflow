{% extends "base.html" %}
{% block title %}Trocar senha{% endblock %}
{% block breadcrumb %}Trocar senha{% endblock %}

{% block content %}
<div class="page-title">Trocar minha senha</div>

<form class="card" method="post" style="max-width: 360px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if erro %}
  <div class="login-msg login-msg-erro" style="margin-bottom: 16px">{{ erro }}</div>
  {% endif %}

  <div class="form-grid" style="grid-template-columns: 1fr;">
    <div class="field">
      <label for="senha_atual">Senha atual</label>
      <input type="password" id="senha_atual" name="senha_atual" required>
    </div>
    <div class="field">
      <label for="nova_senha">Nova senha</label>
      <input type="password" id="nova_senha" name="nova_senha" required minlength="8">
    </div>
    <div class="field">
      <label for="confirmar_senha">Confirmar nova senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="8">
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-green" type="submit">Salvar nova senha</button>
    <a class="btn btn-outline" href="{{ url_for('dashboard') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
