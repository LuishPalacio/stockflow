services:
  db:
    image: postgres:16-alpine
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-stockflow}
      - POSTGRES_USER=${POSTGRES_USER:-stockflow}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stockflow:
    build: .
    container_name: stockflow
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-stockflow}
      - POSTGRES_USER=${POSTGRES_USER:-stockflow}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:
